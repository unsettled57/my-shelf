<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="작품 서재">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>작품 서재</title>
<style>
:root{
  --bg:#f6f6f8; --card:#fff; --ink:#1d1d22; --sub:#6b6b76; --line:#e4e4ea;
  --accent:#5b5bd6; --accent-soft:#ececfb; --good:#2f8f5b; --warn:#b7791f; --bad:#c0392b;
  --chip:#f0f0f4; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141418; --card:#1e1e24; --ink:#ececf1; --sub:#9a9aa6; --line:#2e2e36;
    --accent:#8b8bf0; --accent-soft:#2a2a45; --chip:#2a2a32; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
header h1{font-size:20px;margin:0}
#syncState{font-size:12px;color:var(--sub);cursor:pointer}
main{padding:0 16px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;color:var(--sub)}
nav.tabbar button b{display:block;font-size:18px;font-weight:400}
nav.tabbar button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;width:52px;height:52px;border-radius:50%;
  border:0;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea.input{min-height:72px;resize:vertical}
.search{font-size:16px;padding:12px 14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.small{font-size:12px;padding:2px 8px}
.chip .x{margin-left:4px;opacity:.7}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin:8px 0;cursor:pointer}
.thumb{width:56px;height:76px;border-radius:8px;object-fit:cover;flex:none;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-weight:700;font-size:20px;overflow:hidden}
.card .body{min-width:0;flex:1}
.card .t{font-weight:600}
.ed{font-size:13px;color:var(--sub);margin-top:2px}
.ed .f{display:inline-block;min-width:30px;color:var(--ink);font-weight:600}
.hint{font-size:12px;color:var(--accent);margin-top:3px}
.muted{color:var(--sub);font-size:13px}
.sec{margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:16px;margin:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:8px 0}
.empty{text-align:center;color:var(--sub);padding:36px 12px}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin:3px 0 6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.own i{background:var(--good)}
.gbar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.gbar span:first-child{width:96px;flex:none}
.gbar .bar{flex:1;margin:0}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.panel-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;background:var(--bg);padding:6px 0 8px;z-index:2}
.panel-head h3{margin:0;font-size:17px}
.cover{width:120px;height:164px;border-radius:10px;object-fit:cover;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-size:40px;font-weight:700;flex:none;overflow:hidden}
.edbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:10px 0}
.edbox h4{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--sub);font-weight:500}
.badge.good{background:rgba(47,143,91,.15);color:var(--good)}
.badge.warn{background:rgba(183,121,31,.15);color:var(--warn)}
.hold-row,.person-row{display:grid;gap:6px;margin:6px 0;align-items:center}
.hold-row{grid-template-columns:1fr 92px 92px 32px}
.person-row{grid-template-columns:1fr 100px 32px}
.iconbtn{border:0;background:none;font-size:18px;color:var(--sub);cursor:pointer}
details.axis{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0;background:var(--card)}
details.axis summary{cursor:pointer;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;
  padding:8px 14px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:.95}
.warntext{color:var(--bad);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pill{font-size:12px;padding:1px 8px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.pill.full{background:rgba(47,143,91,.14);color:var(--good)}
.pill.part{background:rgba(183,121,31,.15);color:var(--warn)}
.pill.rent{border-color:var(--line);color:var(--sub)}
.pill.none{border:1px dashed var(--line);color:var(--sub)}
.heart{color:var(--bad)}
.card{align-items:center}
.thumb{width:48px;height:66px;font-size:18px}
.thumb.sm{width:42px;height:58px;font-size:16px}
.pcard .left{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.big{font-size:22px;font-weight:700;line-height:1;white-space:nowrap}
.big small{font-size:12px;font-weight:500;color:var(--sub);margin-left:2px}
.prow{display:flex;align-items:center;gap:6px;margin-top:6px}
.prow .bar{flex:1;margin:0}
.pct{font-size:12px;color:var(--sub);min-width:32px;text-align:right}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.strip .tile{width:92px;flex:none;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px;margin-top:8px}
.tile{cursor:pointer;min-width:0}
.tcov{position:relative}
.tcover{width:100%;aspect-ratio:3/4;border-radius:10px;object-fit:cover;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:26px}
.tbadge{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.68);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theart{position:absolute;right:5px;top:3px;color:#e0566b;text-shadow:0 0 2px #fff,0 0 2px #fff;font-size:14px}
.tt{font-size:13px;margin-top:5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ts{font-size:11px;color:var(--sub);margin-top:1px}
.sec h2 .muted{font-weight:400}
.taglist-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);gap:6px}
.taglist-row:last-child{border-bottom:0}
</style>
</head>
<body>
<header><h1 id="ttl">홈</h1><span id="syncState" data-act="syncNow"></span></header>
<main id="view"></main>
<button class="fab" id="fab" data-act="newWork" aria-label="작품 추가">＋</button>
<nav class="tabbar">
  <button data-act="tab" data-tab="home"><b>⌂</b>홈</button>
  <button data-act="tab" data-tab="search"><b>⌕</b>검색</button>
  <button data-act="tab" data-tab="library"><b>☰</b>서재</button>
  <button data-act="tab" data-tab="settings"><b>⚙</b>설정</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<datalist id="peopleList"></datalist>

<script>
'use strict';
/* ===== 상수 ===== */
const FORMATS = {
  webtoon:{label:'웹툰', unit:'화'},
  novel:{label:'웹소', unit:'화'},
  drama:{label:'드씨', unit:'트랙'}
};
const FMT_KEYS = Object.keys(FORMATS);
const DEFAULT_PLATFORMS = {webtoon:['봄툰','레진','미블','리디'], novel:['리디','봄툰','미블'], drama:['아코','플링','밤바다']};
const GENRE_AXIS = '장르';
const AXES = ['장르','장면·사건','관계','설정·배경','분위기','공 속성','수 속성','기타'];
const SEED_TAGS = {
  '장르':['로맨스','BL','GL','판타지','드라마','스릴러·미스터리','개그·일상','느와르','아포칼립스','스포츠','힐링','단편'],
  '장면·사건':['첫만남','재회','다툼','화해','고백','질투','오해','이별','구출','정체 발각'],
  '관계':['소꿉친구','계약 관계','적에서 연인','짝사랑','구원'],
  '설정·배경':['동양물','서양풍','오피스','캠퍼스','학원','회귀·빙의·환생','오메가버스','센티넬버스'],
  '분위기':['달달','피폐','코믹','잔잔'],
  '공 속성':['다정공','집착공','광공','연하공','연상공','능글공','무심공','계략공','순정공','대형견공','미인공'],
  '수 속성':['아방수','다정수','미인수','연하수','연상수','단정수','짝사랑수','상처수','능력수','철벽수','도망수']
};
const WATCH = {none:'안 봄', reading:'보는 중', done:'완독'};
const OWN_LABEL = {full:'전체 소장', part:'일부 소장', rent:'대여·기다무', none:'미보유'};
const HOLD_TYPE = {own:'소장', rent:'대여·기다무'};
const ROLES = {author:'작가', voice:'성우'};
const STALE_DAYS = 30;

/* ===== 유틸 ===== */
const $ = s => document.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => Date.now();
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const live = arr => (arr || []).filter(x => !x.deleted);
const clone = o => JSON.parse(JSON.stringify(o));
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
function fmtTime(ts){ if(!ts) return '없음'; const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

/* ===== 범위 계산 ===== */
const RANGE_CAP = 5000;
function parseRange(str){
  const set = new Set(); const bad = [];
  if(!str) return {set, bad};
  const parts = String(str).replace(/[~〜–—]/g,'-').replace(/\s*-\s*/g,'-').split(/[,\s]+/).filter(Boolean);
  for(const p of parts){
    let m = /^(\d+)-(\d+)$/.exec(p);
    if(m){ const a = +m[1], b = +m[2]; if(a >= 1 && b >= a && b - a <= RANGE_CAP){ for(let i=a;i<=b;i++) set.add(i); } else bad.push(p); continue; }
    m = /^(\d+)$/.exec(p);
    if(m && +m[1] >= 1){ set.add(+m[1]); continue; }
    bad.push(p);
  }
  return {set, bad};
}
function formatSet(set){
  const nums = [...set].sort((a,b) => a-b); const out = [];
  for(let i=0;i<nums.length;){ let j=i; while(j+1<nums.length && nums[j+1]===nums[j]+1) j++; out.push(i===j ? `${nums[i]}` : `${nums[i]}-${nums[j]}`); i=j+1; }
  return out.join(', ');
}
function editionStats(ed){
  const own = new Set(), rent = new Set();
  for(const h of ed.holdings || []){ const {set} = parseRange(h.range); for(const n of set) (h.type === 'rent' ? rent : own).add(n); }
  const read = parseRange(ed.read).set;
  const total = +ed.total || 0;
  let status = 'none';
  if(own.size && total && own.size >= total) status = 'full';
  else if(own.size) status = 'part';
  else if(rent.size) status = 'rent';
  let unreadOwned = 0; for(const n of own) if(!read.has(n)) unreadOwned++;
  const maxRead = read.size ? Math.max(...read) : 0;
  return {own, rent, read, total, status, ownCount: own.size, readCount: read.size, unreadOwned, maxRead};
}
function workStats(w){
  const res = {}; let unreadOwned = 0, anyOwn = false, anyHold = false;
  for(const f of FMT_KEYS){ const ed = w.editions?.[f]; if(!ed) continue; const s = editionStats(ed); res[f] = s; unreadOwned += s.unreadOwned; if(s.ownCount) anyOwn = true; if(s.ownCount || s.rent.size) anyHold = true; }
  return {eds: res, unreadOwned, anyOwn, anyHold};
}

/* ===== 초성 검색 ===== */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho = s => [...s].map(c => { const k = c.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 ? CHO[Math.floor(k/588)] : c; }).join('');
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
function textMatch(q, text){
  const nq = norm(q); if(!nq) return true;
  const nt = norm(text); if(nt.includes(nq)) return true;
  if(/[ㄱ-ㅎ]/.test(nq)) return cho(nt).includes(cho(nq));
  return false;
}

/* ===== IndexedDB ===== */
let _db;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open('content-tracker', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('images'); };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function tx(store, mode, fn){
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, mode); const st = t.objectStore(store); const r = fn(st); t.oncomplete = () => res(r?.result); t.onerror = () => rej(t.error); });
}
const kvGet = k => tx('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put(v, k));
const imgGet = id => tx('images', 'readonly', s => s.get(id));
const imgPut = (id, rec) => tx('images', 'readwrite', s => s.put(rec, id));
const imgDel = id => tx('images', 'readwrite', s => s.delete(id));

/* ===== 데이터 ===== */
let data, syncCfg = {url:'', key:'', last:0};
function emptyData(){
  const tags = []; let t = 1;
  for(const axis of Object.keys(SEED_TAGS)) for(const name of SEED_TAGS[axis]) tags.push({id:'t'+(t++).toString(36), name, axis, updatedAt:1});
  return {version:1, works:[], tags, people:[], scenes:[], settings:{platforms:clone(DEFAULT_PLATFORMS), updatedAt:1}};
}
let syncTimer;
async function save(){
  await kvSet('data', data);
  if(syncCfg.url && syncCfg.key){ clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(true), 4000); }
}
const tagById = id => data.tags.find(t => t.id === id);
const personById = id => data.people.find(p => p.id === id);
const workById = id => data.works.find(w => w.id === id);
const platformsOf = f => data.settings.platforms?.[f] || DEFAULT_PLATFORMS[f];
function tagCount(id){ return live(data.works).filter(w => (w.tags||[]).includes(id)).length; }
function personCount(id){ return live(data.works).filter(w => (w.people||[]).some(p => p.id === id)).length; }
function findTagByName(name){ const n = norm(name); return live(data.tags).find(t => norm(t.name) === n); }
function ensureTag(name, axis){
  let t = findTagByName(name);
  if(!t){ t = {id:uid(), name:name.trim(), axis: axis || '기타', updatedAt:now()}; data.tags.push(t); }
  return t;
}
function ensurePerson(name){
  const n = norm(name); let p = live(data.people).find(x => norm(x.name) === n);
  if(!p){ p = {id:uid(), name:name.trim(), updatedAt:now()}; data.people.push(p); }
  return p;
}

/* ===== 이미지 ===== */
const imgURL = new Map();
async function coverURL(id){
  if(imgURL.has(id)) return imgURL.get(id);
  const rec = await imgGet(id); const url = rec?.blob ? URL.createObjectURL(rec.blob) : '';
  imgURL.set(id, url); return url;
}
function dropURL(id){ const u = imgURL.get(id); if(u) URL.revokeObjectURL(u); imgURL.delete(id); }
async function compressImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, 360 / img.width, 480 / img.height);
    const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}
// 화면에 그린 뒤 표지 채우기
async function fillCovers(root=document){
  for(const el of $$('[data-cover]', root)){
    const id = el.dataset.cover; const w = workById(id); if(!w?.hasImg) continue;
    const u = await coverURL(id); if(!u) continue;
    if(el.tagName === 'IMG'){ el.src = u; } else { const im = document.createElement('img'); im.className = el.className; im.src = u; im.alt = ''; im.dataset.cover = id; el.replaceWith(im); }
  }
}
function coverEl(w, cls){ return `<div class="${cls}" data-cover="${esc(w.id)}">${esc((w.title||'?').trim().charAt(0))}</div>`; }

/* ===== 상태 ===== */
const ui = {tab:'home', libView:'grid', q:'', fFormats:[], fOwn:'', fWish:false, fTags:[], libFormat:'', libPlatform:'', libSort:'title', draft:null, draftCover:null};

/* ===== 공통 표시 ===== */
const OWN_SHORT = {full:'소장', part:'일부', rent:'대여', none:'미보유'};
// 감상 진행: 총 화수를 알 때만 %와 남은 수를 계산
function progressOf(s){ return s.total ? {pct: Math.round(Math.min(1, s.readCount / s.total) * 100), left: Math.max(0, s.total - s.readCount)} : {pct:null, left:null}; }
// 형태별 한 줄 배지: 색 = 보유 상태, 글자 = 형태 + 보유 + 감상
function pills(w, st){
  return FMT_KEYS.filter(f => w.editions?.[f]).map(f => {
    const ed = w.editions[f], s = st.eds[f], r = progressOf(s);
    const watch = ed.watch === 'done' ? '완독' : ed.watch === 'reading' ? (r.pct != null ? r.pct + '%' : '보는 중') : '';
    return `<span class="pill ${s.status}">${FORMATS[f].label} ${OWN_SHORT[s.status]}${watch ? ' · ' + watch : ''}</span>`;
  }).join('');
}
function workCard(w, hint=''){
  const st = workStats(w);
  return `<div class="card" data-act="open" data-id="${esc(w.id)}">${coverEl(w,'thumb')}
    <div class="body"><div class="t">${esc(w.title)}${w.wish ? ' <span class="heart">♡</span>' : ''}</div>
    <div class="pills">${pills(w, st) || '<span class="muted">형태 없음</span>'}</div>
    ${hint ? `<div class="hint">${hint}</div>` : ''}</div></div>`;
}
// 이어보기 카드: 남은 수는 숫자로, 진행도는 막대로
function progressCard(w, f){
  const ed = w.editions[f], s = editionStats(ed), r = progressOf(s), u = FORMATS[f].unit;
  const big = r.left != null ? (r.left === 0 ? '끝' : `${r.left}<small>${u} 남음</small>`) : `${s.maxRead}<small>${u}까지</small>`;
  return `<div class="card pcard" data-act="open" data-id="${esc(w.id)}">${coverEl(w,'thumb sm')}
    <div class="body"><div class="t">${esc(w.title)}</div><div class="muted">${FORMATS[f].label} · ${esc(ed.platform||'')}</div>
      ${r.pct != null ? `<div class="prow"><div class="bar"><i style="width:${r.pct}%"></i></div><span class="pct">${r.pct}%</span></div>` : '<div class="muted" style="font-size:12px">총 화수를 넣으면 진행도가 보여요</div>'}</div>
    <div class="left"><div class="big">${big}</div><button class="btn small" data-act="plusOne" data-id="${esc(w.id)}" data-f="${f}" data-from="list">＋1</button></div></div>`;
}
// 표지 타일: 가로 줄·서재 격자용
function coverTile(w, badge='', sub=''){
  return `<div class="tile" data-act="open" data-id="${esc(w.id)}"><div class="tcov">${coverEl(w,'tcover')}${badge ? `<span class="tbadge">${badge}</span>` : ''}${w.wish ? '<span class="theart">♡</span>' : ''}</div>
    <div class="tt">${esc(w.title)}</div>${sub ? `<div class="ts">${sub}</div>` : ''}</div>`;
}
const strip = list => `<div class="strip">${list.map(x => coverTile(x.w, x.badge)).join('')}</div>`;
// 보는 중인 형태 중 남은 수가 가장 적은 것
function nearestEnd(w){
  let best = null;
  for(const f of FMT_KEYS){ const ed = w.editions?.[f]; if(!ed || ed.watch !== 'reading') continue; const r = progressOf(editionStats(ed));
    const left = r.left ?? Infinity; if(!best || left < best.left) best = {f, left, pct: r.pct}; }
  return best;
}

/* ===== 검색 ===== */
function searchWorks(){
  const q = ui.q.trim(); const out = [];
  for(const w of live(data.works)){
    let hint = '';
    if(q){
      if(textMatch(q, w.title)) hint = '';
      else if((w.aliases||[]).some(a => textMatch(q, a))) hint = '별칭: ' + esc((w.aliases||[]).find(a => textMatch(q, a)));
      else {
        const p = (w.people||[]).map(x => ({...x, p: personById(x.id)})).find(x => x.p && !x.p.deleted && textMatch(q, x.p.name));
        if(p) hint = `${ROLES[p.role]||''}: ${esc(p.p.name)}`;
        else {
          const t = (w.tags||[]).map(tagById).find(t => t && !t.deleted && textMatch(q, t.name));
          if(t) hint = '태그: ' + esc(t.name);
          else if(w.memo && textMatch(q, w.memo)) hint = '메모에서 찾음';
          else continue;
        }
      }
    }
    if(ui.fFormats.length && !ui.fFormats.some(f => w.editions?.[f])) continue;
    if(ui.fWish && !w.wish) continue;
    if(ui.fTags.length && !ui.fTags.every(t => (w.tags||[]).includes(t))) continue;
    if(ui.fOwn){
      const st = workStats(w);
      if(ui.fOwn === 'own' && !st.anyOwn) continue;
      if(ui.fOwn === 'unread' && !st.unreadOwned) continue;
      if(ui.fOwn === 'none' && st.anyHold) continue;
      if(ui.fOwn === 'unread') hint = (hint ? hint + ' · ' : '') + `안 본 소장분 ${st.unreadOwned}`;
    }
    out.push({w, hint});
  }
  out.sort((a,b) => a.w.title.localeCompare(b.w.title, 'ko'));
  return out;
}
function renderSearch(){
  const v = $('#view');
  if(!live(data.works).length){
    v.innerHTML = `<div class="empty">아직 등록한 작품이 없어요.<br><br><button class="btn primary" data-act="newWork">첫 작품 추가</button><br><br><span class="muted">JSON 파일이 있다면 설정 → 가져오기</span></div>`;
    return;
  }
  const ownOpts = [['','전체'],['own','소장 있음'],['unread','안 본 소장분'],['none','미보유']];
  v.innerHTML = `
    <input id="q" class="input search" type="search" placeholder="제목·초성·별칭·작가·성우·태그" value="${esc(ui.q)}" autocomplete="off">
    <div class="chips">${FMT_KEYS.map(f => `<span class="chip ${ui.fFormats.includes(f)?'on':''}" data-act="fFormat" data-f="${f}">${FORMATS[f].label}</span>`).join('')}
      <span class="chip ${ui.fWish?'on':''}" data-act="fWish">♡ 보고싶음</span></div>
    <div class="chips">${ownOpts.map(([k,l]) => `<span class="chip ${ui.fOwn===k?'on':''}" data-act="fOwn" data-k="${k}">${l}</span>`).join('')}</div>
    <div class="chips"><span class="chip" data-act="tagPicker">＃ 태그로 찾기${ui.fTags.length ? ` (${ui.fTags.length})` : ''}</span>
      ${ui.fTags.map(id => { const t = tagById(id); return t ? `<span class="chip on" data-act="fTagRemove" data-id="${id}">${esc(t.name)}<span class="x">✕</span></span>` : ''; }).join('')}
      ${(ui.q || ui.fFormats.length || ui.fOwn || ui.fWish || ui.fTags.length) ? '<span class="chip" data-act="fReset">초기화</span>' : ''}</div>
    <div id="results"></div>`;
  const q = $('#q');
  q.addEventListener('input', () => { ui.q = q.value; renderResults(); });
  renderResults();
}
function renderResults(){
  const r = searchWorks();
  $('#results').innerHTML = `<div class="muted">${r.length}개 작품</div>` + (r.map(x => workCard(x.w, x.hint)).join('') || '<div class="empty">조건에 맞는 작품이 없어요</div>');
  fillCovers($('#results'));
}

/* ===== 홈 ===== */
function renderHome(){
  const works = live(data.works);
  if(!works.length){
    $('#view').innerHTML = `<div class="empty">아직 등록한 작품이 없어요.<br><br><button class="btn primary" data-act="newWork">첫 작품 추가</button><br><br><span class="muted">JSON 파일이 있다면 설정 → 가져오기</span></div>`;
    return;
  }
  const reading = [], unread = [], wish = [], other = [], stale = [];
  const limit = Date.now() - STALE_DAYS * 864e5;
  for(const w of works){
    const st = workStats(w); const eds = FMT_KEYS.filter(f => w.editions?.[f]);
    for(const f of eds){ if(w.editions[f].watch === 'reading'){ const r = progressOf(st.eds[f]); reading.push({w, f, left: r.left ?? Infinity}); } }
    if(st.unreadOwned) unread.push({w, n: st.unreadOwned, badge:`안 본 ${st.unreadOwned}`});
    if(w.wish){
      if(!eds.length || eds.some(f => st.eds[f].status !== 'full')) wish.push({w, badge:''});
      const done = eds.filter(f => w.editions[f].watch === 'done'), notDone = eds.filter(f => w.editions[f].watch !== 'done');
      if(done.length && notDone.length) other.push({w, badge:`→ ${notDone.map(f => FORMATS[f].label).join('·')}`});
    }
    for(const f of eds){ const ed = w.editions[f]; if(ed.serial === 'ongoing' && (!ed.totalUpdated || Date.parse(ed.totalUpdated) < limit)){ stale.push({w, f, d: ed.totalUpdated}); break; } }
  }
  reading.sort((a,b) => a.left - b.left || a.w.title.localeCompare(b.w.title, 'ko'));
  unread.sort((a,b) => b.n - a.n);
  const genres = live(data.tags).filter(t => t.axis === GENRE_AXIS).map(t => ({t, n: tagCount(t.id)})).filter(x => x.n).sort((a,b) => b.n - a.n);
  const maxG = genres[0]?.n || 1;
  const sec = (title, n, note='') => `<div class="sec"><h2>${title} <span class="muted">${n}</span></h2>${note ? `<span class="muted">${note}</span>` : ''}</div>`;
  const showAll = ui.more_reading, shown = showAll ? reading : reading.slice(0, 5);
  const counts = FMT_KEYS.map(f => `${FORMATS[f].label} ${works.filter(w => w.editions?.[f]).length}`).join(' · ');
  $('#view').innerHTML = `<div class="muted" style="margin-bottom:4px">작품 ${works.length} · ${counts}</div>` +
    sec('이어보기', reading.length, '남은 화가 적은 순') +
    (reading.length ? shown.map(x => progressCard(x.w, x.f)).join('') + (reading.length > 5 ? `<button class="btn small" data-act="more" data-k="reading">${showAll ? '접기' : `${reading.length - 5}개 더 보기`}</button>` : '') : '<div class="muted">보는 중인 작품이 없어요</div>') +
    (unread.length ? sec('사놓고 안 본 작품', unread.length, '안 본 화가 많은 순') + strip(unread) : '') +
    (wish.length ? sec('♡ 구매 후보', wish.length) + strip(wish) : '') +
    (other.length ? sec('다른 형태로도 보고 싶은 작품', other.length) + strip(other) : '') +
    (stale.length ? sec('연재 중 · 총 화수 확인', stale.length) + `<div class="box">${stale.map(x => `<div class="taglist-row" data-act="open" data-id="${esc(x.w.id)}" style="cursor:pointer"><span>${esc(x.w.title)}</span><span class="muted">${FORMATS[x.f].label} · ${x.d ? esc(x.d) + ' 갱신' : '갱신 기록 없음'}</span></div>`).join('')}</div>` : '') +
    `<details class="axis" style="margin-top:18px"><summary>장르 분포</summary>${genres.map(g => `<div class="gbar"><span>${esc(g.t.name)}</span><div class="bar"><i style="width:${g.n/maxG*100}%"></i></div><span>${g.n}</span></div>`).join('') || '<div class="muted">장르 태그가 붙은 작품이 없어요</div>'}</details>`;
  fillCovers();
}

/* ===== 서재 ===== */
function renderLibrary(){
  const allPlat = [...new Set(live(data.works).flatMap(w => FMT_KEYS.map(f => w.editions?.[f]?.platform).filter(Boolean)))];
  let list = live(data.works).filter(w => (!ui.libFormat || w.editions?.[ui.libFormat]) &&
    (!ui.libPlatform || FMT_KEYS.some(f => w.editions?.[f]?.platform === ui.libPlatform && (!ui.libFormat || f === ui.libFormat))));
  const byTitle = (a,b) => a.title.localeCompare(b.title, 'ko');
  let items = list.map(w => ({w, badge:''}));
  if(ui.libSort === 'title') items.sort((a,b) => byTitle(a.w,b.w));
  else if(ui.libSort === 'updated') items.sort((a,b) => b.w.updatedAt - a.w.updatedAt);
  else if(ui.libSort === 'remain'){
    items = items.map(x => { const n = nearestEnd(x.w); return {...x, n, badge: n ? (n.left === Infinity ? '보는 중' : `${n.left}${FORMATS[n.f].unit} 남음`) : ''}; });
    items.sort((a,b) => (a.n ? a.n.left : 1e9 + 1) - (b.n ? b.n.left : 1e9 + 1) || byTitle(a.w,b.w));
  } else {
    items = items.map(x => { const n = workStats(x.w).unreadOwned; return {...x, n, badge: n ? `안 본 ${n}` : ''}; });
    items.sort((a,b) => b.n - a.n || byTitle(a.w,b.w));
  }
  const sub = w => FMT_KEYS.filter(f => w.editions?.[f]).map(f => FORMATS[f].label).join('·');
  const body = ui.libView === 'grid'
    ? `<div class="grid">${items.map(x => coverTile(x.w, x.badge, sub(x.w))).join('')}</div>`
    : items.map(x => workCard(x.w, x.badge)).join('');
  $('#view').innerHTML = `<div class="grid2">
      <select class="input" id="libFormat"><option value="">모든 형태</option>${FMT_KEYS.map(f => `<option value="${f}" ${ui.libFormat===f?'selected':''}>${FORMATS[f].label}</option>`).join('')}</select>
      <select class="input" id="libPlatform"><option value="">모든 플랫폼</option>${allPlat.map(p => `<option ${ui.libPlatform===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
    <div class="chips">${[['title','제목순'],['remain','엔딩 가까운 순'],['unread','안 본 소장분 많은 순'],['updated','최근 수정']].map(([k,l]) => `<span class="chip ${ui.libSort===k?'on':''}" data-act="libSort" data-k="${k}">${l}</span>`).join('')}</div>
    <div class="row" style="justify-content:space-between"><span class="muted">${items.length}개 작품</span>
      <span class="row" style="gap:4px"><span class="chip small ${ui.libView==='grid'?'on':''}" data-act="libView" data-k="grid">▦ 표지</span><span class="chip small ${ui.libView==='list'?'on':''}" data-act="libView" data-k="list">☰ 목록</span></span></div>
    ${items.length ? body : '<div class="empty">작품이 없어요</div>'}`;
  $('#libFormat').onchange = e => { ui.libFormat = e.target.value; renderLibrary(); };
  $('#libPlatform').onchange = e => { ui.libPlatform = e.target.value; renderLibrary(); };
  fillCovers();
}

/* ===== 시트 ===== */
let sheetOnClose = null;
function openSheet(html, onClose){ $('#panel').innerHTML = html; $('#sheet').classList.remove('hidden'); $('#panel').scrollTop = 0; sheetOnClose = onClose || null; document.body.style.overflow = 'hidden'; }
function closeSheet(){ $('#sheet').classList.add('hidden'); $('#panel').innerHTML = ''; document.body.style.overflow = ''; const f = sheetOnClose; sheetOnClose = null; if(f) f(); }
$('#sheet').addEventListener('click', e => { if(e.target.id === 'sheet') closeSheet(); });

/* ===== 작품 상세 ===== */
function renderDetail(id){
  const w = workById(id); if(!w || w.deleted) return closeSheet();
  const st = workStats(w);
  const people = (w.people||[]).map(x => ({...x, p: personById(x.id)})).filter(x => x.p && !x.p.deleted);
  const tags = (w.tags||[]).map(tagById).filter(t => t && !t.deleted);
  const eds = FMT_KEYS.filter(f => w.editions?.[f]).map(f => {
    const ed = w.editions[f], s = st.eds[f], fm = FORMATS[f];
    const pct = (n) => s.total ? Math.min(100, n / s.total * 100) : 0;
    return `<div class="edbox"><h4><span>${fm.label} <span class="muted">${esc(ed.platform||'')}</span></span>
        <span><span class="badge ${ed.serial==='ongoing'?'warn':'good'}">${ed.serial==='ongoing'?'연재 중':'완결'}</span> <span class="badge">${WATCH[ed.watch||'none']}</span></span></h4>
      <div class="muted">총 ${s.total || '?'}${fm.unit}${ed.totalUpdated ? ` (갱신 ${esc(ed.totalUpdated)})` : ''} · ${OWN_LABEL[s.status]}</div>
      ${s.total ? `<div class="muted" style="margin-top:6px">소장 ${s.ownCount}/${s.total}</div><div class="bar own"><i style="width:${pct(s.ownCount)}%"></i></div>
      <div class="muted">읽음 ${s.readCount}/${s.total} · ${Math.round(pct(s.readCount))}%${s.readCount < s.total ? ` · <b style="color:var(--ink)">${s.total - s.readCount}${fm.unit} 남음</b>` : ''}</div><div class="bar"><i style="width:${pct(s.readCount)}%"></i></div>` : `<div class="muted" style="margin-top:6px">소장 ${s.ownCount}${fm.unit} · 읽음 ${s.readCount}${fm.unit}</div>`}
      ${(ed.holdings||[]).map(h => `<div class="ed">${HOLD_TYPE[h.type]||''} ${esc(h.range)} · ${esc(h.platform||'')}</div>`).join('')}
      ${ed.read ? `<div class="ed">읽은 범위: ${esc(ed.read)}</div>` : ''}
      ${s.unreadOwned ? `<div class="hint">안 본 소장분 ${s.unreadOwned}${fm.unit}</div>` : ''}
      <div class="row" style="margin-top:8px"><button class="btn small" data-act="plusOne" data-id="${esc(w.id)}" data-f="${f}">＋1${fm.unit} 읽음</button></div></div>`;
  }).join('');
  const related = (w.related||[]).map(workById).filter(r => r && !r.deleted);
  openSheet(`<div class="panel-head"><h3>작품</h3><div class="row"><button class="btn small" data-act="edit" data-id="${esc(w.id)}">편집</button><button class="iconbtn" data-act="close">✕</button></div></div>
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap">${coverEl(w,'cover')}
      <div style="min-width:0"><div style="font-size:18px;font-weight:700">${esc(w.title)}</div>
        ${(w.aliases||[]).length ? `<div class="muted">별칭: ${esc(w.aliases.join(', '))}</div>` : ''}
        <div class="chips">${people.map(x => `<span class="chip small" data-act="searchFor" data-q="${esc(x.p.name)}">${ROLES[x.role]||''} ${esc(x.p.name)}</span>`).join('')}</div>
        <button class="btn small" data-act="toggleWish" data-id="${esc(w.id)}">${w.wish ? '♥ 보고싶음 해제' : '♡ 보고싶음'}</button></div></div>

async function saveWork(){
  readForm();
  const d = ui.draft;
  if(!d.title){ toast('제목을 입력해 주세요'); return; }
  const dup = live(data.works).find(w => w.id !== d.id && norm(w.title) === norm(d.title));
  if(dup && !confirm(`'${dup.title}'이(가) 이미 있어요. 그래도 저장할까요?`)) return;
  const orig = workById(d.id);
  const editions = {};
  for(const f of FMT_KEYS){
    if(!d._enabled[f]) continue;
    const ed = d.editions[f];
    ed.total = ed.total === '' ? '' : Math.max(0, parseInt(ed.total, 10) || 0);
    const origTotal = orig?.editions?.[f]?.total;
    if(ed.total !== '' && String(ed.total) !== String(origTotal ?? '')) ed.totalUpdated = today();
    ed.read = ed.read ? formatSet(parseRange(ed.read).set) : '';
    ed.holdings = (ed.holdings||[]).filter(h => h.range).map(h => ({...h, range: formatSet(parseRange(h.range).set) || h.range}));
    if(ed.read && ed.watch === 'none') ed.watch = 'reading';
    if(ed.total && ed.read && parseRange(ed.read).set.size >= ed.total && ed.watch !== 'done') ed.watch = 'done';
    editions[f] = ed;
  }
  const people = [];
  for(const p of d._people){ if(!p.name) continue; const person = ensurePerson(p.name); if(!people.some(x => x.id === person.id && x.role === p.role)) people.push({id: person.id, role: p.role}); }
  const w = {id:d.id, title:d.title, aliases:d.aliases, tags:d.tags, people, wish:d.wish, memo:d.memo, related:d.related||[], editions,
    hasImg: d.hasImg, imgAt: d.imgAt || 0, createdAt: d.createdAt || now(), updatedAt: now()};
  if(ui.draftCover === 'remove'){ w.hasImg = false; w.imgAt = now(); await imgDel(w.id); dropURL(w.id); }
  else if(ui.draftCover?.blob){ w.hasImg = true; w.imgAt = now(); await imgPut(w.id, {blob: ui.draftCover.blob, at: w.imgAt}); dropURL(w.id); }
  const i = data.works.findIndex(x => x.id === w.id);
  if(i >= 0) data.works[i] = w; else data.works.push(w);
  await save();
  ui.draft = null; if(ui.draftCover?.url) URL.revokeObjectURL(ui.draftCover.url); ui.draftCover = null;
  toast('저장했어요');
  renderDetail(w.id);
}

function exportJson(){

// 이름으로 적힌 태그·인물도 받아들임 (일괄 등록용)
function normalizeImported(inc){
  const out = {works:[], tags: inc.tags || [], people: inc.people || [], scenes: inc.scenes || [], settings: inc.settings};
  const t0 = now();
  for(const t of out.tags) t.updatedAt ||= t0;
  for(const p of out.people) p.updatedAt ||= t0;
  const tagIds = new Set([...data.tags, ...out.tags].map(t => t.id));
  const personIds = new Set([...data.people, ...out.people].map(p => p.id));
  for(const w0 of inc.works || []){
    const w = {aliases:[], tags:[], people:[], wish:false, memo:'', related:[], editions:{}, hasImg:false, ...w0};
    w.id ||= uid(); w.updatedAt ||= t0; w.createdAt ||= t0;
    w.tags = (w.tags||[]).map(x => tagIds.has(x) ? x : ensureTag(String(x), (w0.tagAxes||{})[x]).id);
    w.people = (w.people||[]).map(x => typeof x === 'string' ? {id: ensurePerson(x).id, role:'author'} : (personIds.has(x.id) ? x : {id: ensurePerson(x.name || x.id).id, role: x.role || 'author'}));
    for(const f of FMT_KEYS){ const ed = w.editions[f]; if(ed){ w.editions[f] = {...blankEdition(f), ...ed}; } }
    delete w.tagAxes;
    out.works.push(w);
  }
  return out;
}
async function importJson(e){
  const file = e.target.files[0]; if(!file) return;
  try{
    const inc = normalizeImported(JSON.parse(await file.text()));
    data = mergeData(data, inc);
    await save(); toast(`가져왔어요 (작품 ${inc.works.length}개)`); render();
  }catch(err){ alert('가져오기 실패: ' + err.message); }
  e.target.value = '';
}

/* ===== 동기화 ===== */
function mergeList(a = [], b = []){
  const m = new Map(); for(const x of a) m.set(x.id, x);
  for(const x of b){ const y = m.get(x.id); if(!y || (x.updatedAt||0) > (y.updatedAt||0)) m.set(x.id, x); }
  return [...m.values()];
}
function mergeData(local, remote){
  if(!remote) return local;
  const s = (remote.settings?.updatedAt || 0) > (local.settings?.updatedAt || 0) ? remote.settings : local.settings;
  return {version:1, works: mergeList(local.works, remote.works), tags: mergeList(local.tags, remote.tags), people: mergeList(local.people, remote.people),
    scenes: mergeList(local.scenes, remote.scenes), settings: s || local.settings};
}
async function gas(action, extra = {}){
  const res = await fetch(syncCfg.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({key: syncCfg.key, action, ...extra})});
  const j = await res.json(); if(!j.ok) throw new Error(j.error || '알 수 없는 오류'); return j;
}
const blobToB64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
const b64ToBlob = b64 => { const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type:'image/jpeg'}); };
let syncing = false;
function setSyncState(t){ $('#syncState').textContent = t; }
async function sync(quiet){
  if(!syncCfg.url || !syncCfg.key){ if(!quiet) toast('설정에서 동기화 주소와 키를 먼저 입력하세요'); return; }
  if(syncing) return; if(!navigator.onLine){ setSyncState('오프라인'); return; }
  syncing = true; setSyncState('동기화 중…');
  try{
    const r = await gas('getData');
    if(r.data) data = mergeData(data, JSON.parse(r.data));
    const {images} = await gas('listImages');
    for(const w of data.works){
      const remoteAt = images[w.id] || 0;
      if(w.deleted || !w.hasImg){ if(remoteAt) await gas('deleteImage', {id: w.id}); continue; }
      const loc = await imgGet(w.id);
      if(loc && loc.at > remoteAt) await gas('putImage', {id: w.id, at: loc.at, b64: await blobToB64(loc.blob)});
      else if(remoteAt && (!loc || remoteAt > loc.at)){ const g = await gas('getImage', {id: w.id}); if(g.b64){ await imgPut(w.id, {blob: b64ToBlob(g.b64), at: remoteAt}); dropURL(w.id); } }
    }
    await gas('putData', {data: JSON.stringify(data)});
    await kvSet('data', data);
    syncCfg.last = now(); await kvSet('sync', syncCfg);
    setSyncState('동기화 ' + fmtTime(syncCfg.last));
    if(!quiet) toast('동기화했어요');
    if($('#sheet').classList.contains('hidden')) render();
  }catch(err){ setSyncState('동기화 오류'); if(!quiet) alert('동기화 실패: ' + err.message); console.error(err); }
  finally{ syncing = false; }
}

/* ===== 동작 ===== */
const A = {
  tab: el => { ui.tab = el.dataset.tab; window.scrollTo(0,0); render(); },
  newWork: () => startEdit(null),
  open: el => renderDetail(el.dataset.id),
  close: () => closeSheet(),
  edit: el => startEdit(el.dataset.id),
  cancelEdit: () => { const id = ui.draft?._isNew ? null : ui.draft?.id; const onClose = sheetOnClose; sheetOnClose = null; if(ui.draftCover?.url) URL.revokeObjectURL(ui.draftCover.url); ui.draft = null; ui.draftCover = null; if(id) renderDetail(id); else { sheetOnClose = onClose; closeSheet(); } },
  saveWork: () => saveWork(),
  deleteWork: async () => { if(!confirm('이 작품을 삭제할까요?')) return; const w = workById(ui.draft.id); if(w){ w.deleted = true; w.updatedAt = now(); await save(); } ui.draft = null; closeSheet(); toast('삭제했어요'); },
  fFormat: el => { const f = el.dataset.f; ui.fFormats = ui.fFormats.includes(f) ? ui.fFormats.filter(x => x !== f) : [...ui.fFormats, f]; renderSearch(); },
  fOwn: el => { ui.fOwn = el.dataset.k; renderSearch(); },
  fWish: () => { ui.fWish = !ui.fWish; renderSearch(); },
  fTagRemove: el => { ui.fTags = ui.fTags.filter(x => x !== el.dataset.id); renderSearch(); },
  fReset: () => { ui.q = ''; ui.fFormats = []; ui.fOwn = ''; ui.fWish = false; ui.fTags = []; renderSearch(); },
  tagPicker: () => renderTagPicker(),
  pickTag: el => { const id = el.dataset.id; ui.fTags = ui.fTags.includes(id) ? ui.fTags.filter(x => x !== id) : [...ui.fTags, id]; el.classList.toggle('on'); },
  searchFor: el => { ui.q = el.dataset.q; ui.tab = 'search'; closeSheet(); },
  searchTag: el => { ui.q = ''; ui.fTags = [el.dataset.id]; ui.tab = 'search'; closeSheet(); },
  more: el => { ui['more_'+el.dataset.k] = !ui['more_'+el.dataset.k]; renderHome(); },
  libView: el => { ui.libView = el.dataset.k; renderLibrary(); },
  libSort: el => { ui.libSort = el.dataset.k; renderLibrary(); },
  toggleWish: async el => { const w = workById(el.dataset.id); w.wish = !w.wish; w.updatedAt = now(); await save(); renderDetail(w.id); },
  plusOne: async el => {
    const w = workById(el.dataset.id), f = el.dataset.f, ed = w.editions[f];
    const s = editionStats(ed); const next = s.maxRead + 1;
    if(s.total && next > s.total){ toast('이미 마지막까지 읽었어요'); return; }
    s.read.add(next); ed.read = formatSet(s.read);
    if(ed.watch === 'none') ed.watch = 'reading';
    if(s.total && s.read.size >= s.total) ed.watch = 'done';
    w.updatedAt = now(); await save(); toast(`${FORMATS[f].label} ${next}${FORMATS[f].unit} 읽음`); if(el.dataset.from) render(); else renderDetail(w.id);
  },
  toggleTag: el => {
    if(!el.dataset.keepq) readForm();
    const d = ui.draft, id = el.dataset.id;
    d.tags = d.tags.includes(id) ? d.tags.filter(x => x !== id) : [...d.tags, id];
    if(el.dataset.keepq){ readForm(); ui.tagQuery = ''; }
    rerenderEdit();
  },
  createTag: () => addTagFromInput(),
  toggleRelated: el => { const d = ui.draft, id = el.dataset.id; d.related = (d.related||[]).includes(id) ? d.related.filter(x => x !== id) : [...(d.related||[]), id]; el.classList.toggle('on'); },
  addPerson: () => { readForm(); ui.draft._people.push({name:'', role: ui.draft._enabled.drama ? 'voice' : 'author'}); rerenderEdit(); },
  delPerson: el => { readForm(); ui.draft._people.splice(+el.dataset.i, 1); rerenderEdit(); },
  addHold: el => { readForm(); const f = el.dataset.f, ed = ui.draft.editions[f]; ed.holdings.push({range:'', type:'own', platform: ed.platform}); rerenderEdit(); },
  delHold: el => { readForm(); ui.draft.editions[el.dataset.f].holdings.splice(+el.dataset.i, 1); rerenderEdit(); },
  fullOwn: el => {
    readForm(); const ed = ui.draft.editions[el.dataset.f]; const t = parseInt(ed.total, 10);
    if(!t){ toast('총 화수를 먼저 입력해 주세요'); return; }
    ed.holdings = [{range:`1-${t}`, type:'own', platform: ed.platform}]; rerenderEdit();
  },
  pickCover: () => $('#coverFile').click(),
  removeCover: () => { readForm(); if(ui.draftCover?.url) URL.revokeObjectURL(ui.draftCover.url); ui.draftCover = 'remove'; rerenderEdit(); },
  saveSync: async () => { syncCfg.url = $('#sUrl').value.trim(); syncCfg.key = $('#sKey').value.trim(); await kvSet('sync', syncCfg); toast('저장했어요'); },
  syncNow: async () => { if(ui.tab === 'settings' && $('#sUrl')){ syncCfg.url = $('#sUrl').value.trim(); syncCfg.key = $('#sKey').value.trim(); await kvSet('sync', syncCfg); } sync(false); },
  savePlat: async () => { for(const el of $$('[data-plat]')) data.settings.platforms[el.dataset.plat] = el.value.split(',').map(s => s.trim()).filter(Boolean); data.settings.updatedAt = now(); await save(); toast('저장했어요'); },
  exportJson: () => exportJson(),
  importJson: () => $('#importFile').click(),
  tagManager: () => renderTagManager(),
  personManager: () => renderPersonManager(),
  tagRename: async el => { const t = tagById(el.dataset.id); const n = prompt('새 이름', t.name); if(!n || !n.trim() || n.trim() === t.name) return;
    const other = findTagByName(n); if(other && other.id !== t.id){ toast('같은 이름의 태그가 있어요. 합치기를 쓰세요'); return; }
    t.name = n.trim(); t.updatedAt = now(); await save(); renderTagManager(); },
  tagAxis: async el => { const t = tagById(el.dataset.id); const n = prompt(`옮길 축 이름\n(${AXES.join(', ')})`, t.axis); if(!n || !AXES.includes(n.trim())){ if(n) toast('목록에 있는 축 이름을 입력해 주세요'); return; }
    t.axis = n.trim(); t.updatedAt = now(); await save(); renderTagManager(); },
  tagMerge: async el => { const t = tagById(el.dataset.id); const n = prompt(`'${t.name}'을(를) 어느 태그로 합칠까요? (태그 이름)`); if(!n) return;
    const target = findTagByName(n); if(!target || target.id === t.id){ toast('그 이름의 태그를 찾지 못했어요'); return; }
    for(const w of data.works){ if((w.tags||[]).includes(t.id)){ w.tags = [...new Set(w.tags.map(x => x === t.id ? target.id : x))]; w.updatedAt = now(); } }
    t.deleted = true; t.updatedAt = now(); await save(); toast(`'${target.name}'(으)로 합쳤어요`); renderTagManager(); },
  tagDelete: async el => { const t = tagById(el.dataset.id); const c = tagCount(t.id); if(!confirm(`'${t.name}' 삭제${c ? ` (작품 ${c}개에서 빠져요)` : ''}?`)) return;
    for(const w of data.works){ if((w.tags||[]).includes(t.id)){ w.tags = w.tags.filter(x => x !== t.id); w.updatedAt = now(); } }
    t.deleted = true; t.updatedAt = now(); await save(); renderTagManager(); },
  tagNew: async () => { const n = prompt('새 태그 이름'); if(!n || !n.trim()) return; if(findTagByName(n)){ toast('이미 있는 태그예요'); return; }
    const a = prompt(`축 이름\n(${AXES.join(', ')})`, '기타'); ensureTag(n, AXES.includes((a||'').trim()) ? a.trim() : '기타'); await save(); renderTagManager(); },
  personRename: async el => { const p = personById(el.dataset.id); const n = prompt('새 이름', p.name); if(!n || !n.trim()) return; p.name = n.trim(); p.updatedAt = now(); await save(); renderPersonManager(); },
  personDelete: async el => { const p = personById(el.dataset.id); const c = personCount(p.id); if(!confirm(`'${p.name}' 삭제${c ? ` (작품 ${c}개에서 빠져요)` : ''}?`)) return;
    for(const w of data.works){ if((w.people||[]).some(x => x.id === p.id)){ w.people = w.people.filter(x => x.id !== p.id); w.updatedAt = now(); } }
    p.deleted = true; p.updatedAt = now(); await save(); renderPersonManager(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = A[el.dataset.act]; if(fn){ e.preventDefault(); fn(el, e); }
});

/* ===== 시작 ===== */
(async function init(){
  try{ data = await kvGet('data'); }catch(e){ console.error(e); }
  if(!data){ data = emptyData(); await kvSet('data', data); }
  data.scenes ||= [];
  if(!findTagByName('단편')){ ensureTag('단편', GENRE_AXIS); await kvSet('data', data); } data.settings ||= {platforms: clone(DEFAULT_PLATFORMS), updatedAt:1}; data.settings.platforms ||= clone(DEFAULT_PLATFORMS);
  syncCfg = (await kvGet('sync')) || syncCfg;
  setSyncState(syncCfg.url ? (syncCfg.last ? '동기화 ' + fmtTime(syncCfg.last) : '동기화 안 됨') : '');
  render();
  if(syncCfg.url && syncCfg.key) sync(true);
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
window.__app = {get data(){ return data; }, parseRange, formatSet, editionStats, cho, textMatch, mergeData};
